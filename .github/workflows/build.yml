name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GRADLE_OPTS: "-Xmx2g -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dos2unix
      run: sudo apt-get install -y dos2unix

    - name: Convert line endings (fix CRLF -> LF)
      working-directory: XiaoAnAssistant
      run: |
        dos2unix gradlew gradlew.bat
        chmod +x gradlew
        file gradlew

    - name: Check local.properties
      working-directory: XiaoAnAssistant
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        cat local.properties

    - name: Build Debug APK
      working-directory: XiaoAnAssistant
      run: ./gradlew assembleDebug --no-daemon

    - name: Copy APK to root
      run: |
        find XiaoAnAssistant -name "app-debug.apk" -type f
        cp XiaoAnAssistant/app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
        ls -la app-debug.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app-debug.apk
      if: always()
