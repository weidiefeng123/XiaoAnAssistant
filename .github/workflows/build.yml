name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GRADLE_OPTS: "-Xmx2g -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Show environment info
      run: |
        echo "=== Working directory ==="
        pwd
        ls -la
        echo "=== Java version ==="
        java -version
        echo "=== XiaoAnAssistant contents ==="
        ls -la XiaoAnAssistant/
        echo "=== App contents ==="
        ls -la XiaoAnAssistant/app/
        echo "=== Java sources ==="
        find XiaoAnAssistant/app/src -type f -name "*.java" -o -name "*.xml" -o -name "*.kt" | head -20

    - name: Make gradlew executable
      working-directory: XiaoAnAssistant
      run: |
        chmod +x gradlew
        ls -la gradlew
        file gradlew
        head -3 gradlew

    - name: Check local.properties (auto-generate if missing)
      working-directory: XiaoAnAssistant
      run: |
        if [ ! -f local.properties ]; then
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
        fi

    - name: Build Debug APK
      working-directory: XiaoAnAssistant
      run: ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -200

    - name: List build outputs
      run: |
        echo "=== APK files ==="
        find XiaoAnAssistant -name "*.apk" -type f 2>/dev/null
        echo "=== Build directory ==="
        ls -la XiaoAnAssistant/app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug output"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: XiaoAnAssistant/app/build/outputs/apk/debug/app-debug.apk
      if: always()
