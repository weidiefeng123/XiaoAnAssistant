name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GRADLE_OPTS: "-Xmx2g -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      working-directory: XiaoAnAssistant
      run: |
        chmod +x gradlew
        ls -la gradlew

    - name: Check local.properties (auto-generate if missing)
      working-directory: XiaoAnAssistant
      run: |
        if [ ! -f local.properties ]; then
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
        fi

    - name: Build Debug APK
      working-directory: XiaoAnAssistant
      run: ./gradlew assembleDebug --no-daemon

    - name: Find APK file
      id: find_apk
      run: |
        echo "=== Searching for APK ==="
        find XiaoAnAssistant -name "*.apk" -type f
        APK_PATH=$(find XiaoAnAssistant -name "app-debug.apk" -type f | head -1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "APK_PATH=$APK_PATH"
        ls -la "$APK_PATH"
        # Copy to root for easy access
        cp "$APK_PATH" ./app-debug.apk
        ls -la app-debug.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app-debug.apk

    - name: Create Release with APK
      uses: softprops/action-gh-release@v2
      with:
        files: app-debug.apk
        tag_name: build-${{ github.run_number }}
        name: Build #${{ github.run_number }}
        body: |
          小安助手 (XiaoAnAssistant) Android APK
          Build: ${{ github.run_number }}
          Commit: ${{ github.sha }}
        draft: false
        prerelease: false
