name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GRADLE_OPTS: "-Xmx2g -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      working-directory: XiaoAnAssistant
      run: |
        chmod +x gradlew
        ls -la gradlew

    - name: Check local.properties
      working-directory: XiaoAnAssistant
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        cat local.properties

    - name: Build Debug APK
      working-directory: XiaoAnAssistant
      run: |
        echo "=== Build start ==="
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1
        echo "=== Build end ==="
        echo "=== Find APK ==="
        find . -name "*.apk" -type f
        echo "=== Copy APK to root ==="
        cp app/build/outputs/apk/debug/app-debug.apk ../app-debug.apk || echo "Copy failed"
        ls -la ../app-debug.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app-debug.apk
      if: always()
