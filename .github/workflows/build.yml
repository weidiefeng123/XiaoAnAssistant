name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: List project files
      run: ls -la XiaoAnAssistant/ | head -30

    - name: Grant execute permission for gradlew
      run: chmod +x XiaoAnAssistant/gradlew

    - name: Make gradlew executable (force)
      working-directory: XiaoAnAssistant
      run: |
        chmod +x gradlew
        ls -la gradlew
        head -1 gradlew

    - name: Build Debug APK
      working-directory: XiaoAnAssistant
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Verify APK was created
      run: |
        ls -la XiaoAnAssistant/app/build/outputs/apk/debug/ || echo "APK not found"
        find XiaoAnAssistant -name "*.apk" -type f 2>/dev/null

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: XiaoAnAssistant/app/build/outputs/apk/debug/app-debug.apk
      if: always()

    - name: Build Release APK
      working-directory: XiaoAnAssistant
      run: ./gradlew assembleRelease --no-daemon
      continue-on-error: true

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-unsigned
        path: XiaoAnAssistant/app/build/outputs/apk/release/app-release-unsigned.apk
      if: always()
